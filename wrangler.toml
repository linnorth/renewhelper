name = "renewhelper"
main = "_worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 绑定 KV 数据库
[[kv_namespaces]]
binding = "RENEW_KV"
id = "80902dba39de4a81b4ce8c519cc7d2d8"

# 设置定时任务 (Cron Triggers)
# 这里设置每 5 分钟检查一次 (*/5 * * * *)，以支持自定义分钟级别的提醒时间
# 必须设置这个，否则自动续期和通知功能无法触发
[triggers]
crons = ["*/5 * * * *"]

# 环境变量默认值 (可选)
# 部署时通常会提示用户输入，这里作为默认值
[vars]
AUTH_PASSWORD = "admin"

[env.production]
name = "renewhelper"

[env.staging]
name = "renewhelper-staging"
