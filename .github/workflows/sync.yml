name: Sync Upstream
on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8:00 自动检查同步一次
  workflow_dispatch: # 同时也支持在 GitHub 手动点按钮立即同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ieax/renewhelper.git || true
          git fetch upstream
          git checkout main
          git merge upstream/main -m "Sync upstream updates" || true
          git push origin main
